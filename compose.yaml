services:
  qwc2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5176:5175"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5177
    ports:
      - "127.0.0.1:5177:5177"
    environment:
      QGIS_SERVER_PROXY_TARGET: http://qgis-server
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  qgis-world-data:
    image: qgis/qgis-server:3.44.16-noble@sha256:67ecbe09d66df2d6c5e554c43f4f2800eba7fc42998953fabb57505ec96b5878
    entrypoint: ["/bin/bash", "/io/scripts/prepare-world.sh"]
    environment:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      TERRAIN_AREA_NAME: "${TERRAIN_AREA_NAME:-Macizo del Ida, Creta}"
      TERRAIN_BBOX: "${TERRAIN_BBOX:-24.60,35.10,24.96,35.35}"
    volumes:
      - ./QGIS/scripts:/io/scripts:ro
      - qgis_world_data:/io/data
    cpus: "1.0"
    mem_limit: 1g
    restart: "no"

  qgis-server:
    image: qgis/qgis-server:3.44.16-noble@sha256:67ecbe09d66df2d6c5e554c43f4f2800eba7fc42998953fabb57505ec96b5878
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - qgis_world_data:/io/data:ro
    depends_on:
      qgis-world-data:
        condition: service_completed_successfully
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7200:7200"
    environment:
      QGIS_PREFIX_PATH: /usr
      QT_QPA_PLATFORM: offscreen
      TERRAIN_REGION_ROOT: /io/data/terrain/regions
      TERRAIN_SCRIPT_PATH: /io/scripts/prepare-terrain.py
      PUBLIC_QGIS_WMS_URL: http://localhost:8085/ogc/world
    volumes:
      - ./QGIS/scripts:/io/scripts:ro
      - qgis_world_data:/io/data
    depends_on:
      qgis-server:
        condition: service_started
    cpus: "1.0"
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - /opt/backend-venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7200/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  qgis_world_data:
