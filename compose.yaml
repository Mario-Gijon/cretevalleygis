services:
  qwc2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5176:5175"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5177
    ports:
      - "127.0.0.1:5177:5177"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  frontend_node_modules:
